name: Build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [build/resurgence-core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/resurgence-payout-execute/index.ts supabase/functions/resurgence-participant-siws-challenge/index.ts supabase/functions/resurgence-participant-siws-submit/index.ts
